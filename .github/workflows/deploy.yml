name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify production dist output
        run: |
          test -f dist/index.html
          if grep -q "src/main.tsx" dist/index.html; then
            echo "ERROR: dist/index.html still references src/main.tsx"
            exit 1
          fi
          ls -1 dist/assets/index-*.js
          ls -1 dist/assets/index-*.css
          if [ -d dist/src ] || [ -f dist/package.json ]; then
            echo "ERROR: dist contains unbuilt source files"
            exit 1
          fi
          ls -la dist dist/assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
